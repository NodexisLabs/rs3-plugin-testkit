# Test an RS3 Lua plugin on every push, offline, with the RS3 plugin test kit.
#
# Copy this file to .github/workflows/rs3-plugin-tests.yml in your plugin's
# repository and set PLUGIN and SPECS below. The job:
#   1. checks plugin.json, main.lua and resources/ against the client's rules
#      (--release also fails on release blockers such as a placeholder email);
#   2. runs your *_spec.lua files against the mock API;
#   3. uploads a JUnit report so failures show up per test.
# It makes no network requests to RuneScape, the wiki or anything else: the
# only downloads are the actions, Python, the kit and (optionally) one shallow
# clone of the community id tables.
name: rs3-plugin-tests

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PLUGIN: plugin          # folder holding plugin.json and main.lua
  SPECS: spec             # folder (or files) holding *_spec.lua
  # Pin the kit to a release tag or commit you have checked.
  TESTKIT: "git+https://github.com/NodexisLabs/rs3-plugin-testkit@main"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the test kit
        run: python -m pip install "$TESTKIT"
      # Optional: full id.* tables (id.NPC, id.Obj, real font numbers, ...).
      # If your plugin uses only stylesheets and fonts by name, you can delete
      # this step and the --ids option below.
      - name: Fetch the community id tables
        run: git clone --depth 1 https://github.com/FriendlyDevelopment/runescape-api-stubs "$RUNNER_TEMP/stubs"
      - name: Check the plugin folder
        run: rs3test check "$PLUGIN"
      - name: Run specs
        run: rs3test run "$PLUGIN" $SPECS --junit junit.xml --ids "$RUNNER_TEMP/stubs"
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rs3-plugin-tests
          path: junit.xml
