[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rs3-plugin-testkit"
version = "0.1.0"
description = "Offline test kit for RuneScape 3 Lua plugins: mock API, manifest validator, spec runner"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["lupa>=2.0"]

[project.scripts]
rs3test = "rs3testkit.cli:main"

[tool.setuptools]
packages = ["rs3testkit"]

[tool.setuptools.package-data]
rs3testkit = ["lua/*.lua", "lua/mock/*.lua"]
